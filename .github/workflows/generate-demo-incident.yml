name: Generate scheduled demo incident

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Demo incident scenario
        required: true
        default: random
        type: choice
        options:
          - random
          - privacy-guard
  schedule:
    - cron: "0 */6 * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: scheduled-demo-incident
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate repository variables
        env:
          AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
          SERVICENOW_SECRET_ID: ${{ vars.SERVICENOW_SECRET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AWS_OIDC_ROLE_ARN" || -z "$SERVICENOW_SECRET_ID" ]]; then
            echo "Required repository variables are not configured." >&2
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: scheduled-demo-incident-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Retrieve ServiceNow secret and create one incident
        env:
          SERVICENOW_SECRET_ID: ${{ vars.SERVICENOW_SECRET_ID }}
          SERVICENOW_CALLER_MODE: random
          SCENARIO: ${{ github.event.inputs.scenario || 'random' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_file="$(mktemp "$RUNNER_TEMP/servicenow-secret.XXXXXX")"
          privacy_dataset="$(mktemp "$RUNNER_TEMP/privacy-demo.XXXXXX.json")"
          trap 'rm -f "$secret_file" "$privacy_dataset"' EXIT

          aws secretsmanager get-secret-value \
            --region eu-central-1 \
            --secret-id "$SERVICENOW_SECRET_ID" \
            --query SecretString \
            --output text > "$secret_file"

          arguments=(--secret-file "$secret_file")
          if [[ "$SCENARIO" == "privacy-guard" ]]; then
            cat > "$privacy_dataset" <<'JSON'
          [
            {
              "source_id": "servicenow:privacy-demo:00000000000000000000000000000099",
              "incident_sys_id": "00000000000000000000000000000099",
              "number": "INC9000099",
              "state": "In Progress",
              "active": true,
              "short_description": "Customer notification requests time out after deployment",
              "description": "A customer reports repeated notification timeouts after the latest deployment.\nName: Alex Morgan\nEmail: alex.morgan@example.invalid\nPhone: +1 202-555-0147\nThe notification worker retries successfully after several minutes.",
              "category": "Software",
              "subcategory": "Application",
              "priority": "2 - High",
              "impact": "2 - Medium",
              "urgency": "2 - Medium",
              "assignment_group": "Cloud Platform Operations",
              "cmdb_ci": "notification-orchestrator",
              "opened_at": "2026-08-17T09:00:00Z",
              "resolved_at": null,
              "close_code": null,
              "close_notes": null,
              "root_cause": null,
              "resolution": null,
              "tags": ["cluster:privacy-guard", "privacy", "pii", "bedrock", "synthetic"],
              "synthetic": true
            }
          ]
          JSON
            arguments+=(--dataset "$privacy_dataset" --scenario privacy-guard)
          elif [[ "$SCENARIO" != "random" ]]; then
            echo "Unsupported demo scenario." >&2
            exit 2
          fi

          python scripts/generate_scheduled_incident.py "${arguments[@]}"
