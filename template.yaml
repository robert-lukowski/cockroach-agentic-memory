AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Agentic Incident Memory deterministic RAG API scaffold

Parameters:
  ApplicationName:
    Type: String
    Default: agentic-incident-memory
    AllowedPattern: "[a-z][a-z0-9-]+"
    MaxLength: 40
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: "[a-z][a-z0-9-]+"
    MaxLength: 16
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  GenerationModelId:
    Type: String
    Default: openai.gpt-oss-20b-1:0
  McpSecretArn:
    Type: String
    Description: ARN of the existing secret containing only the Managed MCP API key
    MinLength: 20
  CockroachClusterId:
    Type: String
    Description: CockroachDB Cloud cluster UUID used by the Managed MCP header
    AllowedPattern: "[0-9a-fA-F-]{36}"
  CockroachDatabase:
    Type: String
    Default: defaultdb
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_-]*"
  McpUrl:
    Type: String
    Default: https://cockroachlabs.cloud/mcp

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 512
    Timeout: 28
    Environment:
      Variables:
        APP_MODE: live
        SERVICE_NAME: !Ref ApplicationName
        REPOSITORY_BACKEND: managed-mcp
        EMBEDDING_DIMENSIONS: "1024"
        BEDROCK_EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
        BEDROCK_GENERATION_MODEL_ID: !Ref GenerationModelId
        MCP_URL: !Ref McpUrl
        MCP_SECRET_ARN: !Ref McpSecretArn
        COCKROACH_CLUSTER_ID: !Ref CockroachClusterId
        COCKROACH_DATABASE: !Ref CockroachDatabase

Resources:
  IncidentMemoryApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ApplicationName}-${EnvironmentName}-api"
      StageName: v1
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: AWS_IAM

  IncidentMemoryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ApplicationName}-${EnvironmentName}-lambda"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: write-function-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ApplicationName}-${EnvironmentName}:*"
        - PolicyName: invoke-approved-bedrock-models
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${GenerationModelId}"
        - PolicyName: read-managed-mcp-credential
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref McpSecretArn

  IncidentMemoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ApplicationName}-${EnvironmentName}"
      CodeUri: src/
      Handler: handler.lambda_handler
      Role: !GetAtt IncidentMemoryFunctionRole.Arn
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref IncidentMemoryApi
            Path: /health
            Method: GET
        CreateIncident:
          Type: Api
          Properties:
            RestApiId: !Ref IncidentMemoryApi
            Path: /incidents
            Method: POST
        Investigate:
          Type: Api
          Properties:
            RestApiId: !Ref IncidentMemoryApi
            Path: /investigations
            Method: POST
    Metadata:
      BuildMethod: python3.13

  IncidentMemoryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApplicationName}-${EnvironmentName}"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: IAM-authenticated REST API base URL
    Value: !Sub "https://${IncidentMemoryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1"
  FunctionName:
    Description: Lambda function name
    Value: !Ref IncidentMemoryFunction
