<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Trusted Operational Memory Lifecycle</title>
  <desc id="desc">Two-path architecture diagram showing privacy-protected read-only incident investigation and resolved-only trusted memory ingestion with CockroachDB as durable operational memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#09101c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173d68"/>
      <stop offset="1" stop-color="#102845"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14566c"/>
      <stop offset="1" stop-color="#0d3446"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65471a"/>
      <stop offset="1" stop-color="#3b2b16"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#205736"/>
      <stop offset="1" stop-color="#123923"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41306d"/>
      <stop offset="1" stop-color="#271e47"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#36d9ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#71f39b"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#f4f8ff}
      .subtitle{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#9fb4cc}
      .lane{font:700 19px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px}
      .cardTitle{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#f7fbff;text-anchor:middle}
      .cardBody{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#c7d7e8;text-anchor:middle}
      .micro{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#8ea7c2;text-anchor:middle;letter-spacing:.35px}
      .pill{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#dff8ff;text-anchor:middle}
      .principleTitle{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#eef7ff}
      .principleBody{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#a9bfd5}
      .quote{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#d8f6ff}
    </style>
  </defs>

  <rect width="1600" height="930" fill="url(#bg)"/>
  <circle cx="1380" cy="120" r="270" fill="#3a1f7a" opacity="0.12"/>
  <circle cx="180" cy="560" r="330" fill="#006b86" opacity="0.08"/>

  <text x="64" y="72" class="title">Trusted Operational Memory Lifecycle</text>
  <text x="64" y="106" class="subtitle">Faster incident investigation without lowering the guard around data, evidence, or durable memory</text>
  <line x1="64" y1="126" x2="1536" y2="126" stroke="#25405c"/>

  <text x="64" y="166" class="lane" fill="#35d7ff">INVESTIGATION FLOW · READ ONLY</text>
  <text x="64" y="191" class="subtitle">The active incident is context for retrieval — it is not written into trusted operational memory.</text>

  <!-- Investigation arrows -->
  <g stroke="#36d9ff" stroke-width="4" fill="none" marker-end="url(#arrowCyan)" opacity="0.88">
    <path d="M250 310 H294"/>
    <path d="M486 310 H530"/>
    <path d="M722 310 H766"/>
    <path d="M958 310 H1002"/>
    <path d="M1194 310 H1238"/>
    <path d="M1430 310 H1470"/>
  </g>

  <!-- Cards, pseudo-3D shadow + face -->
  <g filter="url(#shadow)">
    <g transform="translate(64 222)">
      <polygon points="12,16 176,16 190,29 26,29" fill="#1b517e" opacity=".55"/>
      <polygon points="176,16 190,29 190,190 176,177" fill="#071a2b" opacity=".9"/>
      <rect x="0" y="0" width="176" height="177" rx="20" fill="url(#blue)" stroke="#3aa9ff"/>
      <circle cx="88" cy="44" r="22" fill="#0d6daf" stroke="#65c9ff"/>
      <text x="88" y="51" class="cardTitle">1</text>
      <text x="88" y="88" class="cardTitle">Active Incident</text>
      <text x="88" y="116" class="cardBody"><tspan x="88">New ServiceNow or</tspan><tspan x="88" dy="20">Command Center case</tspan></text>
      <text x="88" y="157" class="micro">UNTRUSTED CURRENT CONTEXT</text>
    </g>

    <g transform="translate(300 222)">
      <polygon points="12,16 176,16 190,29 26,29" fill="#1d6774" opacity=".6"/>
      <polygon points="176,16 190,29 190,190 176,177" fill="#071f27" opacity=".9"/>
      <rect width="176" height="177" rx="20" fill="url(#cyan)" stroke="#3ce3ff"/>
      <path d="M74 37 l14 -9 14 9 v20 c0 14 -10 25 -14 28 -4 -3 -14 -14 -14 -28z" fill="none" stroke="#72f0ff" stroke-width="3"/>
      <path d="M81 55 l6 6 11 -14" fill="none" stroke="#72f0ff" stroke-width="3"/>
      <text x="88" y="95" class="cardTitle">Privacy Guard</text>
      <text x="88" y="122" class="cardBody"><tspan x="88">Bounded direct-identifier</tspan><tspan x="88" dy="20">redaction before AI</tspan></text>
      <text x="88" y="160" class="micro">SANITIZE FIRST</text>
    </g>

    <g transform="translate(536 222)">
      <polygon points="12,16 176,16 190,29 26,29" fill="#1b517e" opacity=".55"/>
      <polygon points="176,16 190,29 190,190 176,177" fill="#071a2b" opacity=".9"/>
      <rect width="176" height="177" rx="20" fill="url(#blue)" stroke="#3aa9ff"/>
      <g fill="none" stroke="#6fc7ff" stroke-width="2.5">
        <rect x="59" y="35" width="25" height="25" transform="rotate(30 71.5 47.5)"/>
        <rect x="91" y="35" width="25" height="25" transform="rotate(30 103.5 47.5)"/>
        <rect x="75" y="62" width="25" height="25" transform="rotate(30 87.5 74.5)"/>
      </g>
      <text x="88" y="107" class="cardTitle">Titan Embedding</text>
      <text x="88" y="134" class="cardBody">Sanitized symptoms</text>
      <text x="88" y="154" class="cardBody">→ 1,024 dimensions</text>
    </g>

    <g transform="translate(772 222)">
      <polygon points="12,16 176,16 190,29 26,29" fill="#234d67" opacity=".7"/>
      <polygon points="176,16 190,29 190,190 176,177" fill="#071824" opacity=".9"/>
      <rect width="176" height="177" rx="20" fill="#12364b" stroke="#4ad8ff" stroke-width="1.4"/>
      <ellipse cx="88" cy="45" rx="34" ry="12" fill="#114c70" stroke="#76dcff"/>
      <path d="M54 45v45c0 7 15 12 34 12s34-5 34-12V45" fill="#0d4261" stroke="#76dcff"/>
      <ellipse cx="88" cy="68" rx="34" ry="12" fill="none" stroke="#76dcff" opacity=".7"/>
      <ellipse cx="88" cy="90" rx="34" ry="12" fill="none" stroke="#76dcff" opacity=".7"/>
      <text x="88" y="126" class="cardTitle">CockroachDB</text>
      <text x="88" y="148" class="cardBody">Distributed Vector Indexing</text>
      <text x="88" y="167" class="micro">TOP-K · COSINE · RESOLVED ONLY</text>
    </g>

    <g transform="translate(1008 222)">
      <polygon points="12,16 176,16 190,29 26,29" fill="#1f5f4a" opacity=".6"/>
      <polygon points="176,16 190,29 190,190 176,177" fill="#081e18" opacity=".9"/>
      <rect width="176" height="177" rx="20" fill="#163d32" stroke="#6ff0a0"/>
      <circle cx="88" cy="51" r="27" fill="none" stroke="#83f3aa" stroke-width="3"/>
      <path d="M74 51 l9 9 19 -21" fill="none" stroke="#83f3aa" stroke-width="4"/>
      <text x="88" y="100" class="cardTitle">Validated Evidence</text>
      <text x="88" y="126" class="cardBody"><tspan x="88">Scope checked and</tspan><tspan x="88" dy="20">sanitized again</tspan></text>
      <text x="88" y="163" class="micro">APPLICATION CONTROLLED</text>
    </g>

    <g transform="translate(1244 222)">
      <polygon points="12,16 176,16 190,29 26,29" fill="#4b387b" opacity=".65"/>
      <polygon points="176,16 190,29 190,190 176,177" fill="#171126" opacity=".9"/>
      <rect width="176" height="177" rx="20" fill="url(#purple)" stroke="#9a7cff"/>
      <circle cx="88" cy="50" r="30" fill="none" stroke="#bca8ff" stroke-width="3"/>
      <path d="M72 50c0-12 10-20 20-17 6-6 17-3 18 6 8 2 10 13 4 19-2 11-17 13-23 6-7 6-20 1-19-9-5-2-5-4 0-5z" fill="none" stroke="#bca8ff" stroke-width="2.6"/>
      <text x="88" y="101" class="cardTitle">Bedrock Investigator</text>
      <text x="88" y="128" class="cardBody"><tspan x="88">Grounded reasoning over</tspan><tspan x="88" dy="20">validated evidence only</tspan></text>
      <text x="88" y="164" class="micro">NO SQL · NO SCOPE CONTROL</text>
    </g>

    <g transform="translate(1476 240)">
      <rect width="72" height="140" rx="18" fill="#173f2a" stroke="#69f08e"/>
      <circle cx="36" cy="42" r="19" fill="none" stroke="#7cf59b" stroke-width="3"/>
      <path d="M25 42 l7 7 15 -17" fill="none" stroke="#7cf59b" stroke-width="3"/>
      <text x="36" y="81" class="pill">GROUNDED</text>
      <text x="36" y="98" class="pill">ACTION</text>
      <text x="36" y="122" class="micro">+ provenance</text>
    </g>
  </g>

  <rect x="64" y="424" width="1480" height="2" fill="#203a53"/>
  <text x="64" y="470" class="lane" fill="#f2b94b">TRUSTED MEMORY LIFECYCLE · WRITE PATH</text>
  <text x="64" y="495" class="subtitle">Only resolved or closed incidents can pass through the controlled synchronization path into durable memory.</text>

  <g stroke="#71f39b" stroke-width="4" fill="none" marker-end="url(#arrowGreen)" opacity="0.88">
    <path d="M288 626 H340"/>
    <path d="M564 626 H616"/>
    <path d="M840 626 H892"/>
    <path d="M1116 626 H1168"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(64 534)">
      <polygon points="14,16 210,16 224,30 28,30" fill="#76531e" opacity=".55"/>
      <polygon points="210,16 224,30 224,204 210,190" fill="#251b0f" opacity=".9"/>
      <rect width="210" height="190" rx="20" fill="url(#amber)" stroke="#e9b84e"/>
      <text x="105" y="48" class="cardTitle">Resolved / Closed</text>
      <text x="105" y="72" class="cardTitle">Incident</text>
      <text x="105" y="111" class="cardBody"><tspan x="105">Verified operational</tspan><tspan x="105" dy="20">root cause + resolution</tspan></text>
      <rect x="44" y="150" width="122" height="24" rx="12" fill="#2e2416" stroke="#c99536"/>
      <text x="105" y="167" class="pill">LIFECYCLE GATE</text>
    </g>

    <g transform="translate(340 534)">
      <polygon points="14,16 210,16 224,30 28,30" fill="#7b5517" opacity=".6"/>
      <polygon points="210,16 224,30 224,204 210,190" fill="#24190c" opacity=".9"/>
      <rect width="210" height="190" rx="20" fill="url(#amber)" stroke="#ffc653"/>
      <path d="M84 36 l21 -13 21 13v28c0 20-15 35-21 40-6-5-21-20-21-40z" fill="none" stroke="#ffd477" stroke-width="3"/>
      <path d="M95 59 l8 8 14 -18" fill="none" stroke="#ffd477" stroke-width="3"/>
      <text x="105" y="126" class="cardTitle">Privacy Guard</text>
      <text x="105" y="151" class="cardBody">Before embedding + persistence</text>
      <text x="105" y="174" class="micro">BOUNDED DIRECT IDENTIFIERS</text>
    </g>

    <g transform="translate(616 534)">
      <polygon points="14,16 210,16 224,30 28,30" fill="#1f5e3b" opacity=".6"/>
      <polygon points="210,16 224,30 224,204 210,190" fill="#091f15" opacity=".9"/>
      <rect width="210" height="190" rx="20" fill="url(#green)" stroke="#74ee9a"/>
      <circle cx="105" cy="52" r="28" fill="none" stroke="#8af6aa" stroke-width="3"/>
      <path d="M91 52 l9 9 20 -22" fill="none" stroke="#8af6aa" stroke-width="4"/>
      <text x="105" y="111" class="cardTitle">Sanitized Verified</text>
      <text x="105" y="135" class="cardTitle">Memory Record</text>
      <text x="105" y="164" class="cardBody">Provenance + lifecycle retained</text>
    </g>

    <g transform="translate(892 534)">
      <polygon points="14,16 210,16 224,30 28,30" fill="#1c5b47" opacity=".55"/>
      <polygon points="210,16 224,30 224,204 210,190" fill="#091c17" opacity=".9"/>
      <rect width="210" height="190" rx="20" fill="url(#green)" stroke="#74ee9a"/>
      <g fill="none" stroke="#9affb7" stroke-width="2.5">
        <rect x="76" y="34" width="25" height="25" transform="rotate(30 88.5 46.5)"/>
        <rect x="109" y="34" width="25" height="25" transform="rotate(30 121.5 46.5)"/>
        <rect x="92" y="63" width="25" height="25" transform="rotate(30 104.5 75.5)"/>
      </g>
      <text x="105" y="114" class="cardTitle">Titan Embedding</text>
      <text x="105" y="140" class="cardBody">Vector created from sanitized</text>
      <text x="105" y="160" class="cardBody">verified incident content</text>
    </g>

    <g transform="translate(1168 522)">
      <polygon points="14,16 300,16 314,30 28,30" fill="#245f36" opacity=".7"/>
      <polygon points="300,16 314,30 314,216 300,202" fill="#071c11" opacity=".9"/>
      <rect width="300" height="202" rx="22" fill="#153c25" stroke="#7df5a1" stroke-width="1.6"/>
      <ellipse cx="70" cy="59" rx="37" ry="13" fill="#1c6e3b" stroke="#8df9aa"/>
      <path d="M33 59v54c0 8 17 13 37 13s37-5 37-13V59" fill="#155d32" stroke="#8df9aa"/>
      <ellipse cx="70" cy="86" rx="37" ry="13" fill="none" stroke="#8df9aa" opacity=".75"/>
      <ellipse cx="70" cy="113" rx="37" ry="13" fill="none" stroke="#8df9aa" opacity=".75"/>
      <text x="188" y="50" class="cardTitle">CockroachDB</text>
      <text x="188" y="75" class="cardTitle">Trusted Operational Memory</text>
      <text x="188" y="110" class="cardBody"><tspan x="188">Durable resolved record +</tspan><tspan x="188" dy="19">vector representation together</tspan></text>
      <rect x="124" y="151" width="128" height="24" rx="12" fill="#0d2a19" stroke="#62dd86"/>
      <text x="188" y="168" class="pill">MANAGED MCP ACCESS</text>
    </g>
  </g>

  <!-- read path from trusted memory -->
  <path d="M1320 522 C1320 472 942 474 862 414 C832 391 840 382 858 365" fill="none" stroke="#70f19a" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowGreen)" opacity=".85"/>
  <rect x="1055" y="449" width="210" height="28" rx="14" fill="#0d2618" stroke="#4ba66a"/>
  <text x="1160" y="468" class="pill">READ VERIFIED MEMORY</text>

  <!-- principles -->
  <rect x="64" y="774" width="1480" height="88" rx="20" fill="#0a1727" stroke="#203f5c"/>
  <g transform="translate(92 796)">
    <text class="principleTitle">Privacy by design</text>
    <text y="22" class="principleBody">Configured direct identifiers are sanitized before embedding or persistence.</text>
  </g>
  <line x1="400" y1="790" x2="400" y2="846" stroke="#23425e"/>
  <g transform="translate(430 796)">
    <text class="principleTitle">Resolved-only memory</text>
    <text y="22" class="principleBody">Active incidents remain read-only context until their outcome is verified.</text>
  </g>
  <line x1="776" y1="790" x2="776" y2="846" stroke="#23425e"/>
  <g transform="translate(806 796)">
    <text class="principleTitle">Application-controlled evidence</text>
    <text y="22" class="principleBody">Models never choose SQL, scope, retrieval count, or supporting incident IDs.</text>
  </g>
  <line x1="1190" y1="790" x2="1190" y2="846" stroke="#23425e"/>
  <g transform="translate(1220 796)">
    <text class="principleTitle">CockroachDB = durable memory</text>
    <text y="22" class="principleBody">Operational record, provenance, lifecycle, and vector retrieval stay together.</text>
  </g>

  <rect x="64" y="881" width="1480" height="1" fill="#1f3d57"/>
  <text x="64" y="914" class="quote">“It is not only what can the model see? It is also what are we willing to remember?”</text>
  <text x="1450" y="914" text-anchor="end" style="font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#8c6cff">CockroachDB · foundation of trusted operational memory</text>
</svg>